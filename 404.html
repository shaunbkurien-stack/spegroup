<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Page not found | SPE Group</title>
<meta content="noindex" name="robots"/>
<link href="/icon-192.png" rel="icon" type="image/png"/>
<style>
:root{--paper:#f3f1ea;--ink:#0a3025;--deep:#071e17;--brass:#b18a42;--muted:#5c6f66}
@media (prefers-color-scheme:dark){:root{--paper:#071e17;--ink:#f3f1ea;--deep:#f3f1ea;--brass:#c9a861;--muted:#a8beb3}}
*{box-sizing:border-box;margin:0}
body{min-height:100svh;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:Aptos,"Segoe UI",system-ui,-apple-system,sans-serif;padding:32px}
main{max-width:520px;text-align:left}
.mark{display:inline-flex;align-items:center;gap:12px;margin-bottom:34px;font-weight:750;letter-spacing:-.01em}
.mark i{width:38px;height:38px;border-radius:10px;background:var(--deep);color:var(--paper);display:grid;place-items:center;font-style:normal;font-size:.72rem;font-weight:800;letter-spacing:.06em}
@media (prefers-color-scheme:dark){.mark i{background:var(--paper);color:#071e17}}
.code{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);margin-bottom:14px}
h1{font-size:clamp(1.9rem,5vw,2.6rem);letter-spacing:-.03em;line-height:1.08;margin-bottom:14px}
p{color:var(--muted);line-height:1.6;margin-bottom:30px}
a.btn{display:inline-block;background:var(--deep);color:var(--paper);text-decoration:none;font-weight:650;padding:13px 22px;border-radius:999px}
@media (prefers-color-scheme:dark){a.btn{background:var(--paper);color:#071e17}}
a.plain{display:inline-block;margin-left:18px;color:var(--ink);text-underline-offset:3px}
</style>
</head>
<body>
<main>
<span class="mark"><i>SPE</i>SPE Group</span>
<div class="code">404 · Page not found</div>
<h1>That page is outside the scope boundary.</h1>
<p>The address may have changed or never existed. The rest of the site is intact.</p>
<a class="btn" href="/">Back to the homepage</a><a class="plain" href="mailto:shaun@spegroup.com.au">shaun@spegroup.com.au</a>
</main>
</body>
</html>
